# Render Blueprint: backend API + PostgreSQL database.
# Deploy via: Render dashboard -> New -> Blueprint -> connect SumanRaj07/rosterflow.
# After the first deploy, seed the database once from the service's Shell tab:
#   python -m app.seed
services:
  - type: web
    name: rosterflow-backend
    env: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: rosterflow-db
          property: connectionString
      # Set this AFTER deploying the frontend on Vercel, then redeploy:
      # - key: CORS_ORIGINS
      #   value: https://<your-app>.vercel.app

databases:
  - name: rosterflow-db
    plan: free
