services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rosterflow
      POSTGRES_PASSWORD: rosterflow
      POSTGRES_DB: rosterflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://rosterflow:rosterflow@db:5432/rosterflow
    ports:
      - "8000:8000"
    depends_on:
      - db
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
